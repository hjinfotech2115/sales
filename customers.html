<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers | SalesFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <i class="ri-bar-chart-grouped-fill"></i>
                <h2>SalesFlow</h2>
            </div>
            <nav>
                <a href="index.html"><i class="ri-dashboard-line"></i> Dashboard</a>
                <a href="inventory.html"><i class="ri-shopping-bag-3-line"></i> Inventory</a>
                <a href="customers.html" class="active"><i class="ri-user-3-line"></i> Customers</a>
                <a href="settings.html"><i class="ri-settings-4-line"></i> Settings</a>
            </nav>
            <div class="user-profile">
                <div class="avatar"><img src="https://ui-avatars.com/api/?name=Admin+User&background=6366f1&color=fff"
                        alt="User"></div>
                <div class="user-info">
                    <h4>Admin User</h4>
                    <p>Manager</p>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="search-bar">
                    <i class="ri-search-line"></i>
                    <input type="text" id="searchInput" placeholder="Search customers...">
                </div>
                <div class="actions">
                    <button class="btn-primary" id="openModalBtn"><i class="ri-user-add-line"></i> Add Customer</button>
                </div>
            </header>

            <section class="content-card">
                <div class="card-header">
                    <h3>Customer Directory</h3>
                    <div class="card-actions">
                        <span id="customerCount" style="color: var(--text-muted); font-size: 0.9em;">0 Customers</span>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="sales-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Status</th>
                                <th>Joined</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="customerTableBody"></tbody>
                    </table>
                    <div id="emptyState" class="empty-state hidden">
                        <i class="ri-user-unfollow-line" style="font-size: 3rem; color: var(--border-color);"></i>
                        <p>No customers found</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="customerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">New Customer</h2>
                <button class="close-modal" id="closeModalBtn"><i class="ri-close-line"></i></button>
            </div>
            <form id="customerForm">
                <input type="hidden" id="customerId">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="custName" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="custEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" id="custPhone" placeholder="+1 (555)...">
                    </div>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="custStatus">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-text" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn-primary">Save Customer</button>
                </div>
            </form>
        </div>
    </div>

    <script src="customers.js"></script>
</body>

</html>
